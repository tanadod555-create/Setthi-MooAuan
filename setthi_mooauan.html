    // Helper: Daily mascot level 1-10
    function getLevelForDate(dateStr, seed = 0) {
      let hash = seed;
      for (let i = 0; i < dateStr.length; i++) {
        hash = ((hash << 5) - hash) + dateStr.charCodeAt(i);
        hash |= 0;
      }
      return (Math.abs(hash) % 10) + 1;

    // ========================================================
    // COMPONENT: CIRCULAR PROGRESS
    // ========================================================
    function CircularProgress({ value, max, size = 95, strokeWidth = 8, color = '#ff6584', bgColor = '#fed7e2', label = 'เกณฑ์วัน' }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const safePercent = Math.min(Math.max(value / (max || 1), 0), 1);
      const offset = circumference - safePercent * circumference;

      return (
        <div className="relative inline-flex items-center justify-center shrink-0" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="transform -rotate-90">
            <circle cx={size / 2} cy={size / 2} r={radius} stroke={bgColor} strokeWidth={strokeWidth} fill="transparent" />
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              stroke={color}
              strokeWidth={strokeWidth}
              fill="transparent"
              strokeDasharray={circumference}
              strokeDashoffset={offset}
              strokeLinecap="round"
              className="transition-all duration-700 ease-out"
            />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span className="text-sm font-mono font-black">{Math.round((value / (max || 1)) * 100)}%</span>
            <span className="text-[9px] text-slate-500 font-bold">{label}</span>
          </div>
        </div>
      );
    }

    // ========================================================
    // COMPONENT: ANALYTICS & STATS VIEW (Daily, Weekly, Monthly)
    // ========================================================
    function StatsView({ transactions, isBoy, cardClass }) {
      const [period, setPeriod] = useState('daily'); // 'daily' | 'weekly' | 'monthly'

      // Filtered data based on period
      const chartData = useMemo(() => {
        const now = new Date();
        const formatYMD = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

        if (period === 'daily') {
          // Last 7 days
          const days = [];
          for (let i = 6; i >= 0; i--) {
            const d = new Date(now);
            d.setDate(d.getDate() - i);
            const dateStr = formatYMD(d);
            const label = d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric' });

            const dayTxns = transactions.filter(t => t.date === dateStr);
            const income = dayTxns.filter(t => t.type === 'INCOME').reduce((s, t) => s + t.amount, 0);
            const expense = dayTxns.filter(t => t.type === 'EXPENSE').reduce((s, t) => s + t.amount, 0);

            days.push({ key: dateStr, label, income, expense });
          }
          return days;
        } else if (period === 'weekly') {
          // Last 4 weeks
          const weeks = [];
          for (let i = 3; i >= 0; i--) {
            const end = new Date(now);
            end.setDate(end.getDate() - (i * 7));
            const start = new Date(end);
            start.setDate(start.getDate() - 6);

            const startStr = formatYMD(start);
            const endStr = formatYMD(end);
            const label = `${start.getDate()} - ${end.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })}`;

            const weekTxns = transactions.filter(t => t.date >= startStr && t.date <= endStr);
            const income = weekTxns.filter(t => t.type === 'INCOME').reduce((s, t) => s + t.amount, 0);
            const expense = weekTxns.filter(t => t.type === 'EXPENSE').reduce((s, t) => s + t.amount, 0);

            weeks.push({ key: `W-${i}`, label, income, expense });
          }
          return weeks;
        } else {
          // Last 6 months
          const months = [];
          for (let i = 5; i >= 0; i--) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const yr = d.getFullYear();
            const mo = String(d.getMonth() + 1).padStart(2, '0');
            const monthStr = `${yr}-${mo}`;
            const label = d.toLocaleDateString('th-TH', { month: 'short', year: '2-digit' });

            const mTxns = transactions.filter(t => t.date && t.date.startsWith(monthStr));
            const income = mTxns.filter(t => t.type === 'INCOME').reduce((s, t) => s + t.amount, 0);
            const expense = mTxns.filter(t => t.type === 'EXPENSE').reduce((s, t) => s + t.amount, 0);

            months.push({ key: monthStr, label, income, expense });
          }
          return months;
        }
      }, [transactions, period]);

      // Category Expense breakdown
      const expenseByCategory = useMemo(() => {
        const map = {};
        transactions.filter(t => t.type === 'EXPENSE').forEach(t => {
          map[t.category] = (map[t.category] || 0) + t.amount;
        });
        const totalExp = Object.values(map).reduce((s, a) => s + a, 0) || 1;
        return Object.entries(map)
          .map(([name, amount]) => ({
            name,
            amount,
            percent: Math.round((amount / totalExp) * 100),
            meta: getCategoryInfo(name, 'EXPENSE')
          }))
          .sort((a, b) => b.amount - a.amount);
      }, [transactions]);

      // Category Income breakdown
      const incomeByCategory = useMemo(() => {
        const map = {};
        transactions.filter(t => t.type === 'INCOME').forEach(t => {
          map[t.category] = (map[t.category] || 0) + t.amount;
        });

  "note": "บันทึกช่วยจำ (ถ้ามี)",
  "slipRef": "เลขอ้างอิงสลิป"
}`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${settings.geminiApiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },

                contents: [{

                    { text: prompt },
                    { inline_data: { mime_type: file.type || 'image/jpeg', data: cleanBase64 } }
                  ]

                generationConfig: { responseMimeType: "application/json" }

            if (!res.ok) throw new Error(`HTTP ${res.status}`);

                  <select
                    id="manual_category"
                    className="w-full text-xs font-bold text-slate-700 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none"
                  >
                    {(manualType === 'INCOME' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES).map(c => (
                      <option key={c.id} value={c.name}>{c.icon} {c.name}</option>
                    ))}
                  </select>
                </div>

                <div className="flex gap-2 pt-2">
                  <button onClick={() => setShowManualAdd(false)} className="flex-1 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold text-xs">
                    ยกเลิก
                  </button>
                  <button
                    onClick={() => {
                      const amt = parseFloat(document.getElementById('manual_amount').value) || 0;
                      const mer = document.getElementById('manual_merchant').value || (manualType === 'INCOME' ? 'รายรับ' : 'ไม่ระบุ');
                      const cat = document.getElementById('manual_category').value;

                      handleSaveTransaction({
                        id: `TXN-${Date.now()}`,
                        date: selectedDate,
                        time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                        type: manualType,
                        category: cat,
                        amount: amt,
                        wallet: 'เงินสด',
                        merchant: mer,
                        note: 'จดด้วยตนเอง',
                        isCategorized: true
                      });
                      setShowManualAdd(false);
                    }}
                    className={`flex-1 py-2.5 ${manualType === 'INCOME' ? 'bg-emerald-500 hover:bg-emerald-600 text-white rounded-full' : 'btn-candy-yellow'} text-xs font-black shadow-md`}
                  >
                    {manualType === 'INCOME' ? '💰 บันทึกรายรับ' : '💾 บันทึกรายจ่าย'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Settings Modal */}
          {showSettings && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="max-w-sm w-full p-5 bg-white rounded-3xl shadow-2xl space-y-3.5 border-2 border-slate-200 text-xs">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-black text-slate-800">⚙️ ตั้งค่า: {currentUser.name}</h3>
                  <button onClick={() => setShowSettings(false)} className="text-slate-400 font-bold">✕</button>
                </div>

                <div>
                  <label className="font-bold text-slate-600 block mb-1">ขีดจำกัดงบรายจ่ายเดือนนี้ (บาท)</label>
                  <input
                    type="number"
                    id="cfg_monthly_limit"
                    defaultValue={settings.monthlyLimit || 20000}
                    className="w-full font-bold bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none"
                  />
                  <p className="text-[10px] text-slate-400 mt-1">
                    🎯 กำหนดเป้าหมายว่าจะใช้ไม่เกินเท่าไหร่ในเดือนนี้ (รายรับจะนับแยกต่างหาก)
                  </p>
                </div>

                <div>
                  <label className="font-bold text-slate-600 block mb-1">เกณฑ์กำหนดรายวัน (บาท/วัน)</label>
                  <input
                    type="number"
                    id="cfg_daily_budget"
                    defaultValue={settings.dailyBudget || 600}
                    className="w-full font-bold bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none"
                  />
                  <p className="text-[10px] text-slate-400 mt-0.5">
                    📌 เกณฑ์อ้างอิงเปรียบเทียบในวงแหวนของน้องหมูแต่ละวัน
                  </p>
                </div>

                <div>
                  <label className="font-bold text-slate-600 block mb-1">Gemini API Key (สำหรับสแกนสลิป)</label>
                  <input
                    type="password"
                    id="cfg_key"
                    defaultValue={settings.geminiApiKey}
                    placeholder="AIzaSy..."
                    className="w-full font-mono bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none"
                  />
                  <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-[10px] text-pink-500 underline mt-0.5 inline-block font-bold">
                    รับ Gemini API Key ฟรีจาก Google AI Studio
                  </a>
                </div>

                <div>
                  <label className="font-bold text-slate-600 block mb-1">Google Apps Script Web App URL</label>
                  <input
                    type="url"
                    id="cfg_url"
                    defaultValue={settings.googleAppsScriptUrl}
                    placeholder="https://script.google.com/macros/s/.../exec"
                    className="w-full font-mono bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none"
                  />
                  <p className="text-[10px] text-slate-400 mt-0.5">ใช้ Code.gs ในโฟลเดอร์โปรเจกต์นี้</p>
                </div>

                <div className="flex gap-2 pt-2">
                  <button onClick={() => setShowSettings(false)} className="flex-1 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold">
                    ปิด
                  </button>
                  <button
                    onClick={() => {
                      const k = document.getElementById('cfg_key').value.trim();
                      const u = document.getElementById('cfg_url').value.trim();
                      const db = parseFloat(document.getElementById('cfg_daily_budget').value) || 600;
                      const ml = parseFloat(document.getElementById('cfg_monthly_limit').value) || 20000;

                      setSettings(prev => ({
                        ...prev,
                        geminiApiKey: k,
                        googleAppsScriptUrl: u,
                        dailyBudget: db,
                        monthlyLimit: ml
                      }));
                      setShowSettings(false);
                      alert('บันทึกการตั้งค่าเรียบร้อยแล้วอู๊ด!');
                    }}
                    className={`flex-1 py-2.5 ${primaryBtnClass} text-xs font-black shadow-md`}
                  >
                    บันทึก
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
