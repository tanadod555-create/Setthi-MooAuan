    // Helper: Daily mascot level 1-10
    function getLevelForDate(dateStr, seed = 0) {
      let hash = seed;
      for (let i = 0; i < dateStr.length; i++) {
        hash = ((hash << 5) - hash) + dateStr.charCodeAt(i);
        hash |= 0;
      }
      return (Math.abs(hash) % 10) + 1;
    }

    // ========================================================
    // AI CHATBOT TRANSACTION PARSER (Gemini + Local Regex Fallback)
    // ========================================================
    function localRegexParse(text) {
      const numMatch = text.match(/(\d+(?:\.\d+)?)/);
      const amount = numMatch ? parseFloat(numMatch[1]) : 0;
      if (amount <= 0) {
        return {
          isTransaction: false,
          replyMessage: 'หมูอ้วนยังไม่เห็นจำนวนเงินเลยน้าอู๊ดๆ 🐷 ลองพิมพ์บอกใหม่ได้นะ เช่น "กินข้าว 60 บาท"'
        };
      }

      const isIncome = /(เงินเดือน|โบนัส|ได้เงิน|รับเงิน|เพื่อนคืน|ขายของ|กำไร|เงินปันผล|ถูกหวย|โอนเข้า|รายรับ)/i.test(text);
      const type = isIncome ? 'INCOME' : 'EXPENSE';

      let category = type === 'INCOME' ? 'รายรับพิเศษ / อื่นๆ' : 'ค่าใช้จ่ายอื่นๆ';
      let cleanMerchant = text.replace(/(\d+(?:\.\d+)?)/g, '').replace(/(บาท|บ\.|บ|thb)/gi, '').trim();
      cleanMerchant = cleanMerchant.replace(/^(กิน|ซื้อ|จ่าย|เติม|ได้|รับ)/g, '').trim() || (type === 'INCOME' ? 'รายรับ' : 'ค่าใช้จ่าย');

      if (type === 'EXPENSE') {
        if (/(น้ำมัน|bts|mrt|แท็กซี่|วิน|รถเมล์|ทางด่วน|เดินทาง|ค่ารถ|grab|bolt)/i.test(text)) {
          category = 'เดินทาง / น้ำมัน';
        } else if (/(ค่าน้ำ|ค่าไฟ|ค่าเน็ต|บิล|ค่าห้อง|ค่าเช่า|ค่าโทรศัพท์)/i.test(text)) {
          category = 'บิล & ค่าน้ำค่าไฟ';
        } else if (/(ยา|หมอ|คลินิก|โรงพยาบาล|วิตามิน|หาหมอ)/i.test(text)) {
          category = 'สุขภาพ / ยา / คลินิก';
        } else if (/(หนัง|เกม|สังสรรค์|เหล้า|เบียร์|เที่ยว|คอนเสิร์ต|ปาร์ตี้)/i.test(text)) {
          category = 'บันเทิง & สังสรรค์';
        } else if (/(ของใช้|เซเว่น|shopee|lazada|ช้อป|เสื้อ|กางเกง|ของเล่น|ครีม)/i.test(text)) {
          category = 'ของใช้ & ช้อปปิ้ง';
        } else if (/(ข้าว|อาหาร|กะเพรา|ก๋วยเตี๋ยว|กาแฟ|ชา|หมูกระทะ|ส้มตำ|ขนม|เค้ก|เบเกอรี่|กิน|เครื่องดื่ม)/i.test(text) || (text.includes('น้ำ') && !text.includes('น้ำมัน') && !text.includes('ค่าน้ำ'))) {
          category = 'อาหารและเครื่องดื่ม';
        }
      } else {
        if (/เงินเดือน/i.test(text)) category = 'เงินเดือนประจำ';
        else if (/ธุรกิจ|ขายของ|กำไร/i.test(text)) category = 'ธุรกิจ / ค้าขาย / กำไร';
        else if (/โบนัส|คอมมิชชั่น/i.test(text)) category = 'โบนัส & คอมมิชชั่น';
        else if (/คืน/i.test(text)) category = 'รับโอนเงิน / เพื่อนคืน';
        else if (/ปันผล|ดอกเบี้ย/i.test(text)) category = 'เงินปันผล & ดอกเบี้ย';
      }

      return {
        isTransaction: true,
        type,
        amount,
        merchant: cleanMerchant,
        category,
        wallet: /โอน/i.test(text) ? 'โอนเงิน' : 'เงินสด',
        note: '',
        replyMessage: `หมูอ้วนช่วยจด ${cleanMerchant} ${amount.toLocaleString()} บาท เรียบร้อยแล้วน้า อู๊ดๆ! 🐷✨`
      };
    }

    async function parseTransactionWithAI(userText, apiKey = DEFAULT_GEMINI_KEY) {
      const cleanKey = apiKey || DEFAULT_GEMINI_KEY;
      const prompt = `
คุณคือ "หมูอ้วนช่วยจด" 🐷 ผู้ช่วยอัจฉริยะด้านการเงินและจดบันทึกรายรับรายจ่ายของแอป "เศรษฐีหมูอ้วน"
ผู้ใช้พิมพ์ข้อความมา: "${userText}"

หน้าที่ของคุณ:
1. วิเคราะห์ว่าข้อความนี้เป็นการบันทึก "รายจ่าย" (EXPENSE) หรือ "รายรับ" (INCOME) หรือเป็นการสนทนาทั่วไป
2. หากเป็นการบันทึก:
   - isTransaction: true
   - type: "EXPENSE" (จ่ายเงินออก) หรือ "INCOME" (รับเงินเข้า)
   - amount: ตัวเลขยอดเงิน (number เช่น 65, 500, 35000)
   - merchant: "ชื่อรายการ/ร้านค้า/สิ่งของ หรือแหล่งที่มาของเงิน (เช่น ข้าวกะเพราหมูกรอบ, กาแฟอเมซอน, เติมน้ำมัน, เงินเดือน)"
   - category:
     * หากเป็น EXPENSE ให้เลือกจาก: ['อาหารและเครื่องดื่ม', 'ของใช้ & ช้อปปิ้ง', 'เดินทาง / น้ำมัน', 'บิล & ค่าน้ำค่าไฟ', 'สุขภาพ / ยา / คลินิก', 'บันเทิง & สังสรรค์', 'ค่าใช้จ่ายอื่นๆ']
     * หากเป็น INCOME ให้เลือกจาก: ['เงินเดือนประจำ', 'ธุรกิจ / ค้าขาย / กำไร', 'โบนัส & คอมมิชชั่น', 'รับโอนเงิน / เพื่อนคืน', 'เงินปันผล & ดอกเบี้ย', 'รายรับพิเศษ / อื่นๆ']
   - wallet: 'เงินสด', 'โอนเงิน', 'TrueMoney', 'บัตรเครดิต' (ถ้าไม่ได้ระบุ ให้ใช้ 'เงินสด')
   - note: บันทึกช่วยจำเพิ่มเติม
   - replyMessage: ข้อความตอบกลับแบบน่ารัก ขี้เล่น เป็นกันเอง สไตล์น้องหมูอ้วน มีคำว่า "อู๊ดๆ 🐷" หรือแซวและให้กำลังใจ

ให้ตอบกลับเป็น JSON Object เท่านั้น:
{
  "isTransaction": true,
  "type": "EXPENSE",
  "amount": 0.0,
  "merchant": "ชื่อรายการ",
  "category": "ชื่อหมวดหมู่",
  "wallet": "เงินสด",
  "note": "",
  "replyMessage": "ข้อความตอบกลับของน้องหมูอ้วน"
}
`;

      if (cleanKey) {
        for (const model of GEMINI_CANDIDATE_MODELS) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cleanKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: 'application/json' }
              })
            });
            if (res.ok) {
              const data = await res.json();
              const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (text) {
                return JSON.parse(text.trim());
              }
            }
          } catch (e) {
            console.warn(`Model ${model} failed for chat:`, e);
          }
        }
      }

      // Local fallback
      return localRegexParse(userText);
    }

    // ========================================================
    // COMPONENT: CIRCULAR PROGRESS
    // ========================================================
    function CircularProgress({ value, max, size = 95, strokeWidth = 8, color = '#ff6584', bgColor = '#fed7e2', label = 'เกณฑ์วัน' }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const safePercent = Math.min(Math.max(value / (max || 1), 0), 1);
      const offset = circumference - safePercent * circumference;

      return (
        <div className="relative inline-flex items-center justify-center shrink-0" style={{ width: size, height: size }}>
          <svg width={size} height={size} className="transform -rotate-90">
            <circle cx={size / 2} cy={size / 2} r={radius} stroke={bgColor} strokeWidth={strokeWidth} fill="transparent" />
            <circle
              cx={size / 2}
              cy={size / 2}
              r={radius}
              stroke={color}
              strokeWidth={strokeWidth}
              fill="transparent"
              strokeDasharray={circumference}
              strokeDashoffset={offset}
              strokeLinecap="round"
              className="transition-all duration-700 ease-out"
            />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center">
            <span className="text-sm font-mono font-black">{Math.round((value / (max || 1)) * 100)}%</span>
            <span className="text-[9px] text-slate-500 font-bold">{label}</span>
          </div>
        </div>
      );
    }

    // ========================================================
    // COMPONENT: DONUT / PIE CHART (Kawaii SVG Interactive)
    // ========================================================
    function DonutChart({ data, total, title, type = 'EXPENSE' }) {
      const [hoveredIdx, setHoveredIdx] = useState(null);
      const size = 190;
      const strokeWidth = 26;
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;

      if (!data || data.length === 0 || total === 0) {
        return (
          <div className="py-8 text-center text-slate-400 text-xs font-bold">
            ยังไม่มีข้อมูลบันทึกในหมวดนี้
          </div>
        );
      }

      let accumulatedFraction = 0;

      return (
        <div className="space-y-4">
          <div className="flex flex-col sm:flex-row items-center justify-center gap-6 py-2">
            {/* SVG Donut Circle */}
            <div className="relative w-44 h-44 flex items-center justify-center shrink-0">
              <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="transform -rotate-90">
                <circle
                  cx={size / 2}
                  cy={size / 2}
                  r={radius}
                  fill="transparent"
                  stroke="#f1f5f9"
                  strokeWidth={strokeWidth}
                />
                {data.map((item, idx) => {
                  const fraction = item.amount / total;
                  const strokeDasharray = `${fraction * circumference} ${circumference}`;
                  const strokeDashoffset = -(accumulatedFraction * circumference);
                  accumulatedFraction += fraction;
                  const isHovered = hoveredIdx === idx;

                  return (
                    <circle
                      key={item.name}
                      cx={size / 2}
                      cy={size / 2}
                      r={radius}
                      fill="transparent"
                      stroke={item.meta.color || (type === 'INCOME' ? '#10b981' : '#ff6584')}
                      strokeWidth={isHovered ? strokeWidth + 5 : strokeWidth}
                      strokeDasharray={strokeDasharray}
                      strokeDashoffset={strokeDashoffset}
                      className="transition-all duration-300 cursor-pointer"
                      onMouseEnter={() => setHoveredIdx(idx)}
                      onMouseLeave={() => setHoveredIdx(null)}
                    />
                  );
                })}
              </svg>

              {/* Center Info */}
              <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center px-2">
                {hoveredIdx !== null && data[hoveredIdx] ? (
                  <>
                    <span className="text-xl">{data[hoveredIdx].meta.icon}</span>
                    <span className="text-[11px] font-black text-slate-700 truncate max-w-[110px]">
                      {data[hoveredIdx].name}
                    </span>
                    <span className={`text-xs font-mono font-black ${type === 'INCOME' ? 'text-emerald-600' : 'text-rose-500'}`}>
                      ฿{data[hoveredIdx].amount.toLocaleString('th-TH', { maximumFractionDigits: 0 })}
                    </span>
                    <span className="text-[10px] font-bold text-slate-400">
                      {data[hoveredIdx].percent}%
                    </span>
                  </>
                ) : (
                  <>
                    <span className="text-[10px] text-slate-400 font-bold">{title}</span>
                    <span className={`text-sm font-mono font-black ${type === 'INCOME' ? 'text-emerald-600' : 'text-rose-500'}`}>
                      ฿{total.toLocaleString('th-TH', { maximumFractionDigits: 0 })}
                    </span>
                    <span className="text-[9px] text-slate-400">
                      {data.length} หมวดหมู่
                    </span>
                  </>
                )}
              </div>
            </div>

            {/* Legend / Breakdown List with Progress Bars */}
            <div className="flex-1 w-full space-y-2">
              {data.map((item, idx) => {
                const isHovered = hoveredIdx === idx;
                return (
                  <div
                    key={item.name}
                    onMouseEnter={() => setHoveredIdx(idx)}
                    onMouseLeave={() => setHoveredIdx(null)}
                    className={`p-2 rounded-xl transition-all cursor-pointer border ${
                      isHovered
                        ? (type === 'INCOME' ? 'bg-emerald-50/80 border-emerald-300 shadow-xs' : 'bg-rose-50/80 border-rose-300 shadow-xs')
                        : 'bg-slate-50/70 border-slate-100 hover:bg-slate-100/70'
                    }`}
                  >
                    <div className="flex items-center justify-between text-xs mb-1">
                      <div className="flex items-center gap-1.5 font-bold text-slate-700">
                        <span>{item.meta.icon}</span>
                        <span className="truncate max-w-[130px]">{item.name}</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className={`font-mono font-black ${type === 'INCOME' ? 'text-emerald-600' : 'text-slate-800'}`}>
                          {type === 'INCOME' ? '+' : '-'}฿{item.amount.toLocaleString('th-TH', { maximumFractionDigits: 0 })}
                        </span>
                        <span className="text-[10px] font-bold text-slate-500 bg-white px-1.5 py-0.5 rounded border border-slate-200">
                          {item.percent}%
                        </span>
                      </div>
                    </div>
                    {/* Visual Bar */}
                    <div className="w-full h-1.5 bg-slate-200/60 rounded-full overflow-hidden">
                      <div
                        className="h-full rounded-full transition-all duration-500"
                        style={{
                          width: `${item.percent}%`,
                          backgroundColor: item.meta.color || (type === 'INCOME' ? '#10b981' : '#ff6584')
                        }}
                      />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ========================================================
    // COMPONENT: ANALYTICS & STATS VIEW (Daily, Weekly, Monthly)
    // ========================================================
    function StatsView({ transactions, isBoy, cardClass }) {
      const [period, setPeriod] = useState('daily'); // 'daily' | 'weekly' | 'monthly'
      const [chartMode, setChartMode] = useState('EXPENSE'); // 'EXPENSE' | 'INCOME' | 'ALL'

      // Filtered data based on period
      const chartData = useMemo(() => {
        const now = new Date();
        const formatYMD = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

        if (period === 'daily') {
          // Last 7 days
          const days = [];
          for (let i = 6; i >= 0; i--) {
            const d = new Date(now);
            d.setDate(d.getDate() - i);
            const dateStr = formatYMD(d);
            const label = d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric' });

            const dayTxns = transactions.filter(t => t.date === dateStr);
            const income = dayTxns.filter(t => t.type === 'INCOME').reduce((s, t) => s + t.amount, 0);
            const expense = dayTxns.filter(t => t.type === 'EXPENSE').reduce((s, t) => s + t.amount, 0);

            days.push({ key: dateStr, label, income, expense });
          }
          return days;
        } else if (period === 'weekly') {
          // Last 4 weeks
          const weeks = [];
          for (let i = 3; i >= 0; i--) {
            const end = new Date(now);
            end.setDate(end.getDate() - (i * 7));
            const start = new Date(end);
            start.setDate(start.getDate() - 6);

            const startStr = formatYMD(start);
            const endStr = formatYMD(end);
            const label = `${start.getDate()} - ${end.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' })}`;

            const weekTxns = transactions.filter(t => t.date >= startStr && t.date <= endStr);
            const income = weekTxns.filter(t => t.type === 'INCOME').reduce((s, t) => s + t.amount, 0);
            const expense = weekTxns.filter(t => t.type === 'EXPENSE').reduce((s, t) => s + t.amount, 0);

            weeks.push({ key: `W-${i}`, label, income, expense });
          }
          return weeks;
        } else {
          // Last 6 months
          const months = [];
          for (let i = 5; i >= 0; i--) {
            const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
            const yr = d.getFullYear();
            const mo = String(d.getMonth() + 1).padStart(2, '0');
            const monthStr = `${yr}-${mo}`;
            const label = d.toLocaleDateString('th-TH', { month: 'short', year: '2-digit' });

            const mTxns = transactions.filter(t => t.date && t.date.startsWith(monthStr));
            const income = mTxns.filter(t => t.type === 'INCOME').reduce((s, t) => s + t.amount, 0);
            const expense = mTxns.filter(t => t.type === 'EXPENSE').reduce((s, t) => s + t.amount, 0);

            months.push({ key: monthStr, label, income, expense });
          }
          return months;
        }
      }, [transactions, period]);

      // Category Expense breakdown
      const expenseByCategory = useMemo(() => {
        const map = {};
        transactions.filter(t => t.type === 'EXPENSE').forEach(t => {
          map[t.category] = (map[t.category] || 0) + t.amount;
        });
        const totalExp = Object.values(map).reduce((s, a) => s + a, 0) || 1;
        return Object.entries(map)
          .map(([name, amount]) => ({
            name,
            amount,
            percent: Math.round((amount / totalExp) * 100),
            meta: getCategoryInfo(name, 'EXPENSE')
          }))
          .sort((a, b) => b.amount - a.amount);
      }, [transactions]);

      // Category Income breakdown
      const incomeByCategory = useMemo(() => {
        const map = {};
        transactions.filter(t => t.type === 'INCOME').forEach(t => {
          map[t.category] = (map[t.category] || 0) + t.amount;
        });
        const totalInc = Object.values(map).reduce((s, a) => s + a, 0) || 1;
        return Object.entries(map)
          .map(([name, amount]) => ({
            name,
            amount,
            percent: Math.round((amount / totalInc) * 100),
            meta: getCategoryInfo(name, 'INCOME')
          }))
          .sort((a, b) => b.amount - a.amount);
      }, [transactions]);

      // Period Totals
      const totalPeriodIncome = chartData.reduce((s, d) => s + d.income, 0);
      const totalPeriodExpense = chartData.reduce((s, d) => s + d.expense, 0);
      const periodBalance = totalPeriodIncome - totalPeriodExpense;

      // Max value for bar heights based on selected mode
      const maxBarValue = useMemo(() => {
        if (chartMode === 'EXPENSE') {
          return Math.max(...chartData.map(d => d.expense), 50);
        }
        if (chartMode === 'INCOME') {
          return Math.max(...chartData.map(d => d.income), 50);
        }
        return Math.max(...chartData.map(d => Math.max(d.income, d.expense)), 50);
      }, [chartData, chartMode]);

      const periodLabel = period === 'daily' ? 'รายวัน' : period === 'weekly' ? 'รายสัปดาห์' : 'รายเดือน';

      return (
        <div className="space-y-4 animate-in fade-in">
          {/* Period Selector Tabs */}
          <div className="flex bg-white/80 p-1.5 rounded-2xl border-2 border-slate-200 gap-1 shadow-sm">
            {[
              { id: 'daily', label: '📅 รายวัน (7 วัน)' },
              { id: 'weekly', label: '📆 รายสัปดาห์ (4 วีค)' },
              { id: 'monthly', label: '📊 รายเดือน (6 เดือน)' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setPeriod(tab.id)}
                className={`flex-1 py-2 rounded-xl text-xs font-black transition-all ${
                  period === tab.id
                    ? isBoy ? 'bg-sky-500 text-white shadow-sm' : 'bg-pink-500 text-white shadow-sm'
                    : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* Period KPI Summary Cards */}
          <div className="grid grid-cols-3 gap-2 text-center">
            <div className={`p-3 ${cardClass} ${chartMode === 'INCOME' ? 'ring-2 ring-emerald-400 bg-emerald-50/40' : ''}`}>
              <span className="text-[10px] text-slate-400 font-bold block">🟢 รวมรายรับ</span>
              <span className="font-mono font-black text-xs sm:text-sm text-emerald-600">
                +฿{totalPeriodIncome.toLocaleString('th-TH', { maximumFractionDigits: 0 })}
              </span>
            </div>
            <div className={`p-3 ${cardClass} ${chartMode === 'EXPENSE' ? 'ring-2 ring-rose-400 bg-rose-50/40' : ''}`}>
              <span className="text-[10px] text-slate-400 font-bold block">🔴 รวมรายจ่าย</span>
              <span className="font-mono font-black text-xs sm:text-sm text-rose-500">
                -฿{totalPeriodExpense.toLocaleString('th-TH', { maximumFractionDigits: 0 })}
              </span>
            </div>
            <div className={`p-3 ${cardClass}`}>
              <span className="text-[10px] text-slate-400 font-bold block">💵 คงเหลือสุทธิ</span>
              <span className={`font-mono font-black text-xs sm:text-sm ${periodBalance < 0 ? 'text-rose-500' : 'text-emerald-600'}`}>
                {periodBalance < 0 ? '-' : '+'}฿{Math.abs(periodBalance).toLocaleString('th-TH', { maximumFractionDigits: 0 })}
              </span>
            </div>
          </div>

          {/* Bar Chart Section */}
          <div className={`p-5 ${cardClass} space-y-4`}>
            {/* Header & Chart Mode Filter */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
              <div>
                <h3 className="text-sm font-black text-slate-800 flex items-center gap-1.5">
                  <span>📈 กราฟแนวโน้ม{chartMode === 'EXPENSE' ? 'รายจ่าย' : chartMode === 'INCOME' ? 'รายรับ' : 'เปรียบเทียบ'} ({periodLabel})</span>
                </h3>
                <p className="text-[10px] text-slate-400">
                  {chartMode === 'EXPENSE' && 'แสดงแท่งรายจ่ายที่เกิดขึ้นในแต่ละช่วงเวลา'}
                  {chartMode === 'INCOME' && 'แสดงแท่งรายรับในแต่ละช่วงเวลา'}
                  {chartMode === 'ALL' && 'แท่งเขียว (รายรับ) เทียบ แท่งแดง (รายจ่าย)'}
                </p>
              </div>

              {/* Chart Mode Toggle Pills */}
              <div className="flex bg-slate-100 p-1 rounded-2xl gap-1 shrink-0">
                <button
                  type="button"
                  onClick={() => setChartMode('EXPENSE')}
                  className={`px-2.5 py-1 rounded-xl text-xs font-black transition-all ${
                    chartMode === 'EXPENSE' ? 'bg-rose-500 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  🔴 เฉพาะรายจ่าย
                </button>
                <button
                  type="button"
                  onClick={() => setChartMode('INCOME')}
                  className={`px-2.5 py-1 rounded-xl text-xs font-black transition-all ${
                    chartMode === 'INCOME' ? 'bg-emerald-500 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  🟢 เฉพาะรายรับ
                </button>
                <button
                  type="button"
                  onClick={() => setChartMode('ALL')}
                  className={`px-2.5 py-1 rounded-xl text-xs font-black transition-all ${
                    chartMode === 'ALL' ? (isBoy ? 'bg-sky-500 text-white shadow-xs' : 'bg-pink-500 text-white shadow-xs') : 'text-slate-500 hover:text-slate-800'
                  }`}
                >
                  ⚖️ เทียบทั้งคู่
                </button>
              </div>
            </div>

            {/* Bars Canvas */}
            <div className="h-44 flex items-end justify-between gap-2 pt-6 pb-1 border-b border-slate-100">
              {chartData.map((d) => {
                const incomeHeight = Math.min((d.income / maxBarValue) * 100, 100);
                const expenseHeight = Math.min((d.expense / maxBarValue) * 100, 100);

                return (
                  <div key={d.key} className="flex-1 flex flex-col items-center h-full justify-end group relative">
                    {/* Tooltip on hover */}
                    <div className="absolute -top-10 bg-slate-800 text-white text-[9px] px-2 py-1 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-20 whitespace-nowrap shadow-lg">
                      {chartMode === 'EXPENSE' && `รายจ่าย: -฿${d.expense.toFixed(0)}`}
                      {chartMode === 'INCOME' && `รายรับ: +฿${d.income.toFixed(0)}`}
                      {chartMode === 'ALL' && `รับ: +฿${d.income.toFixed(0)} | จ่าย: -฿${d.expense.toFixed(0)}`}
                    </div>

                    {/* Bar Elements */}
                    <div className="w-full flex items-end justify-center gap-1 h-36">
                      {chartMode === 'EXPENSE' && (
                        <div
                          className="w-full max-w-[22px] sm:max-w-[28px] bg-rose-400 hover:bg-rose-500 rounded-t-lg transition-all duration-500 shadow-xs"
                          style={{ height: `${Math.max(expenseHeight, d.expense > 0 ? 6 : 2)}%`, opacity: d.expense > 0 ? 1 : 0.25 }}
                          title={`รายจ่าย: ฿${d.expense.toFixed(2)}`}
                        />
                      )}

                      {chartMode === 'INCOME' && (
                        <div
                          className="w-full max-w-[22px] sm:max-w-[28px] bg-emerald-400 hover:bg-emerald-500 rounded-t-lg transition-all duration-500 shadow-xs"
                          style={{ height: `${Math.max(incomeHeight, d.income > 0 ? 6 : 2)}%`, opacity: d.income > 0 ? 1 : 0.25 }}
                          title={`รายรับ: ฿${d.income.toFixed(2)}`}
                        />

    function ChatView({ currentUser, isBoy, cardClass, primaryBtnClass, settings, onSaveTransaction, onDeleteTransaction, transactions }) {
      const [messages, setMessages] = useState(() => {
        const raw = localStorage.getItem(`setthi_chat_${currentUser.username}`);
        if (raw) {
          try { return JSON.parse(raw); } catch (e) {}
        }
        return [
          {
            id: 'msg-init',
            sender: 'assistant',
            text: 'สวัสดีจ้า! หมูอ้วนช่วยจดพร้อมแล้วนะอู๊ดๆ 🐷💖 มีรายการอะไรอยากให้ช่วยบันทึก พิมพ์บอกมาได้เลยน้า เช่น "กินข้าวกะเพรา 65", "ซื้อกาแฟ 50", หรือ "ได้เงินเดือน 35000"',
            time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
          }

      });

      const [inputVal, setInputVal] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const messagesEndRef = useRef(null);

      // Save chat to localStorage
      useEffect(() => {
        localStorage.setItem(`setthi_chat_${currentUser.username}`, JSON.stringify(messages));
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, currentUser]);

      const handleClearChat = () => {
        if (confirm('ต้องการล้างประวัติการคุยกับหมูอ้วนใช่หรือไม่? (รายการที่บันทึกไปแล้วจะไม่ถูกลบ)')) {
          const reset = [

              id: `msg-${Date.now()}`,
              sender: 'assistant',
              text: 'ล้างห้องแชทเรียบร้อยแล้วจ้า! เริ่มต้นจดรายการใหม่บอกหมูอ้วนได้เลยนะอู๊ดๆ 🐷✨',
              time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })

          ];
          setMessages(reset);
          localStorage.setItem(`setthi_chat_${currentUser.username}`, JSON.stringify(reset));

      };

      const handleSendMessage = async (textToSend) => {
        const text = (textToSend || inputVal).trim();
        if (!text || isProcessing) return;

        setInputVal('');
        const userMsg = {
          id: `usr-${Date.now()}`,
          sender: 'user',
          text: text,
          time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
        };
        setMessages(prev => [...prev, userMsg]);
        setIsProcessing(true);

        try {
          const apiKey = settings.geminiApiKey || DEFAULT_GEMINI_KEY;
          const parsed = await parseTransactionWithAI(text, apiKey);

          if (parsed && parsed.isTransaction && parsed.amount > 0) {
            const now = new Date();
            const ymd = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

            const txn = {
              id: `TXN-AI-${Date.now()}`,
              user: currentUser.username,
              date: ymd,
              time: timeStr,
              type: parsed.type === 'INCOME' ? 'INCOME' : 'EXPENSE',
              category: parsed.category || (parsed.type === 'INCOME' ? 'รายรับพิเศษ / อื่นๆ' : 'ค่าใช้จ่ายอื่นๆ'),
              amount: Number(parsed.amount),
              wallet: parsed.wallet || 'เงินสด',
              merchant: parsed.merchant || (parsed.type === 'INCOME' ? 'รายรับ' : 'ค่าใช้จ่าย'),
              note: parsed.note ? `[หมูอ้วน AI] ${parsed.note}` : '[หมูอ้วน AI]',
              isCategorized: true
            };

            await onSaveTransaction(txn);

            const aiMsg = {
              id: `ai-${Date.now()}`,
              sender: 'assistant',
              text: parsed.replyMessage || `จด ${txn.merchant} ${txn.amount.toLocaleString()} บาท เรียบร้อยแล้วอู๊ดๆ! 🐷✨`,
              time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
              savedTxn: txn
            };
            setMessages(prev => [...prev, aiMsg]);
          } else {

              id: `ai-${Date.now()}`,
              sender: 'assistant',
              text: parsed?.replyMessage || 'หมูอ้วนรับทราบจ้า! ถ้ามีรายการใช้จ่ายหรือเงินเข้า พิมพ์บอกได้เลยนะ เช่น "กินส้มตำ 80"',
              time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
            };
            setMessages(prev => [...prev, aiMsg]);
          }
        } catch (err) {
          console.error(err);
          const fallback = localRegexParse(text);
          if (fallback.isTransaction && fallback.amount > 0) {
            const now = new Date();
            const ymd = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const txn = {
              id: `TXN-AI-${Date.now()}`,
              user: currentUser.username,
              date: ymd,
              time: now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
              type: fallback.type,
              category: fallback.category,
              amount: Number(fallback.amount),
              wallet: fallback.wallet,
              merchant: fallback.merchant,
              note: '[หมูอ้วน AI สำรอง]',
              isCategorized: true
            };
            await onSaveTransaction(txn);
            setMessages(prev => [...prev, {
              id: `ai-${Date.now()}`,
              sender: 'assistant',
              text: fallback.replyMessage,
              time: now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
              savedTxn: txn
            }]);
          } else {
            setMessages(prev => [...prev, {
              id: `ai-${Date.now()}`,
              sender: 'assistant',
              text: 'หมูอ้วนได้รับข้อความแล้ว แต่ยังหาจำนวนเงินไม่เจออู๊ดๆ 🐷 ลองพิมพ์ใหม่เป็น "กินข้าว 60 บาท" ดูนะจ๊ะ',
              time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
            }]);
          }
        } finally {
          setIsProcessing(false);
        }
      };

      return (
        <div className={`flex flex-col h-[75vh] max-h-[680px] ${cardClass} p-3 sm:p-4 relative overflow-hidden animate-in fade-in`}>

          <div className="flex items-center justify-between pb-3 border-b border-slate-100 shrink-0">
            <div className="flex items-center gap-2.5">
              <div className="w-10 h-10 rounded-2xl bg-pink-100 border-2 border-pink-200 overflow-hidden p-0.5 shadow-xs flex items-center justify-center">
                <img
                  src={`./mascots/${isBoy ? 'maxnum' : 'manow'}_lv3.png`}
                  alt="Mascot"
                  className="w-full h-full object-contain"

              </div>
              <div>
                <div className="flex items-center gap-1.5">
                  <h3 className="text-sm font-black text-slate-800">หมูอ้วนช่วยจด AI 🐷</h3>
                  <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                </div>
                <p className="text-[10px] text-slate-400 font-bold">พิมพ์อะไรมาก็บันทึกให้ทันที อัจฉริยะ 100%</p>
              </div>
            </div>

            <button
              onClick={handleClearChat}
              className="text-[11px] font-bold text-slate-400 hover:text-rose-500 px-2 py-1 rounded-lg hover:bg-slate-100 transition-colors"
              title="ล้างแชท"
            >
              🗑️ ล้างแชท
            </button>
          </div>

          {/* Messages Scroll Area */}
          <div className="flex-1 overflow-y-auto space-y-3 py-3 pr-1">
            {messages.map((m) => {
              const isUser = m.sender === 'user';
              return (
                <div
                  key={m.id}
                  className={`flex gap-2 ${isUser ? 'justify-end' : 'justify-start'}`}
                >
                  {!isUser && (
                    <div className="w-7 h-7 rounded-xl bg-pink-50 border border-pink-200 overflow-hidden shrink-0 mt-1 flex items-center justify-center">
                      <span className="text-base">🐷</span>
                    </div>
                  )}

                  <div className={`max-w-[85%] sm:max-w-[75%] space-y-1.5 ${isUser ? 'items-end' : 'items-start'}`}>
                    <div
                      className={`p-3 rounded-2xl text-xs font-medium leading-relaxed shadow-xs ${
                        isUser
                          ? isBoy
                            ? 'bg-sky-500 text-white rounded-br-xs'
                            : 'bg-pink-500 text-white rounded-br-xs'
                          : 'bg-white border-2 border-slate-100 text-slate-800 rounded-bl-xs'
                      }`}
                    >
                      <p className="whitespace-pre-wrap">{m.text}</p>

                      {/* Embedded Transaction Card if saved */}
                      {m.savedTxn && (
                        <div className="mt-2.5 p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 space-y-1.5 font-normal">
                          <div className="flex items-center justify-between">
                            <span className={`text-[10px] font-black px-2 py-0.5 rounded-full text-white ${
                              m.savedTxn.type === 'INCOME' ? 'bg-emerald-500' : 'bg-rose-500'
                            }`}>
                              {m.savedTxn.type === 'INCOME' ? '🟢 รายรับ' : '🔴 รายจ่าย'}
                            </span>
                            <span className="text-[10px] font-bold text-emerald-600 flex items-center gap-1">
                              <span>✅ บันทึกแล้ว</span>
                            </span>
                          </div>

                          <div className="flex items-center justify-between text-xs pt-1">
                            <div className="font-bold text-slate-700">
                              <span>{m.savedTxn.merchant}</span>
                              <span className="text-[10px] text-slate-400 block font-normal">{m.savedTxn.category}</span>
                            </div>
                            <div className="text-right">
                              <span className={`font-mono font-black text-sm ${
                                m.savedTxn.type === 'INCOME' ? 'text-emerald-600' : 'text-rose-500'
                              }`}>
                                {m.savedTxn.type === 'INCOME' ? '+' : '-'}฿{m.savedTxn.amount.toLocaleString('th-TH', { minimumFractionDigits: 2 })}
                              </span>
                            </div>
                          </div>

                          <div className="flex items-center justify-between pt-1 border-t border-slate-200/60 text-[10px] text-slate-400">
                            <span>💳 {m.savedTxn.wallet || 'เงินสด'}</span>
                            <button
                              onClick={() => {
                                if (confirm(`ต้องการลบรายการ "${m.savedTxn.merchant}" ใช่หรือไม่?`)) {
                                  onDeleteTransaction(m.savedTxn.id);
                                  m.savedTxn.deleted = true;
                                  setMessages([...messages]);
                                }
                              }}
                              className="text-rose-500 hover:text-rose-700 font-bold hover:underline"
                            >
                              {m.savedTxn.deleted ? '(ลบแล้ว)' : '🗑️ ยกเลิกรายการนี้'}
                            </button>
                          </div>
                        </div>
                      )}
                    </div>

                    <span className={`text-[9px] text-slate-400 block px-1 ${isUser ? 'text-right' : 'text-left'}`}>
                      {m.time}
                    </span>
                  </div>
                </div>
              );
            })}

            {isProcessing && (
              <div className="flex gap-2 items-center text-xs font-bold text-slate-500 animate-pulse pl-9 py-1">
                <span className="text-lg animate-bounce">🐽</span>
                <span>หมูอ้วนกำลังคิดและจดบันทึกลงสมุด...</span>
              </div>
            )}

            <div ref={messagesEndRef} />
          </div>

          {/* Suggestion Chips */}
          <div className="shrink-0 pt-2 border-t border-slate-100 space-y-2">
            <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 text-[11px]">
              <span className="text-slate-400 font-bold text-[10px] shrink-0">กดปุ๊บจดปั๊บ:</span>
              {[
                '🍜 ข้าวกะเพรา 60',
                '☕ กาแฟ 50',
                '🛒 ช้อปปิ้ง 350',
                '🚗 น้ำมัน 800',
                '💰 เงินเดือน 35000',

                <button
                  key={chip}
                  type="button"
                  disabled={isProcessing}
                  onClick={() => handleSendMessage(chip)}
                  className="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold whitespace-nowrap tap-bounce shrink-0"
                >

                </button>

            {/* Input Form */}
            <form
              onSubmit={(e) => {
                e.preventDefault();
                handleSendMessage();
              }}
              className="flex items-center gap-2"
            >
              <input
                type="text"
                value={inputVal}
                onChange={(e) => setInputVal(e.target.value)}
                disabled={isProcessing}
                placeholder="พิมพ์บอกหมูอ้วน เช่น 'กินข้าวเที่ยง 65', 'เงินเดือนเข้า 30000'..."
                className="flex-1 text-xs bg-slate-50 border-2 border-slate-200 focus:border-pink-400 rounded-2xl px-3.5 py-2.5 outline-none font-medium"
              />
              <button
                type="submit"
                disabled={isProcessing || !inputVal.trim()}
                className={`px-4 py-2.5 ${primaryBtnClass} text-xs font-black shadow-md shrink-0 flex items-center gap-1 disabled:opacity-50`}
              >
                <span>🚀</span>
                <span>ส่ง</span>
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ========================================================
    // MAIN APP
    // ========================================================
    function App() {
      // Current logged in account session
      const [currentUser, setCurrentUser] = useState(() => {
        const raw = localStorage.getItem('setthi_auth_session');
        return raw ? JSON.parse(raw) : null;
      });

      const isBoy = currentUser?.username === 'maxnum';
      const userKey = currentUser?.username || 'guest';

      // Set body theme based on logged in user
      useEffect(() => {
        if (currentUser) {
          document.body.className = isBoy ? 'theme-maxnum' : 'theme-manow';
        } else {
          document.body.className = 'theme-manow';
        }
      }, [currentUser, isBoy]);

      // Settings partitioned per user
      const [settings, setSettings] = useState(() => {
        if (!currentUser) return {
          dailyBudget: 600,
          monthlyLimit: 20000,
          geminiApiKey: DEFAULT_GEMINI_KEY,
          googleAppsScriptUrl: DEFAULT_GAS_URL
        };
        const raw = localStorage.getItem(`setthi_settings_${currentUser.username}`);
        const parsed = raw ? JSON.parse(raw) : {};
        return {
          geminiApiKey: parsed.geminiApiKey || DEFAULT_GEMINI_KEY,
          googleAppsScriptUrl: parsed.googleAppsScriptUrl || DEFAULT_GAS_URL,
          dailyBudget: parsed.dailyBudget || (currentUser.username === 'maxnum' ? 600 : 500),
          monthlyLimit: parsed.monthlyLimit || (currentUser.username === 'maxnum' ? 20000 : 18000),
          streakCount: parsed.streakCount || 3
        };
      });

      // Transactions partitioned per user
      const [transactions, setTransactions] = useState(() => {
        if (!currentUser) return [];
        const raw = localStorage.getItem(`setthi_txns_${currentUser.username}`);
        if (raw) return JSON.parse(raw);
        return currentUser.username === 'maxnum' ? DEFAULT_TRANSACTIONS_MAXNUM : DEFAULT_TRANSACTIONS_MANOW;
      });

      // Active view tab: 'home' | 'chat' | 'stats'
      const [activeTab, setActiveTab] = useState('home');

      // Selected Date
      const today = new Date().toISOString().split('T')[0];
      const [selectedDate, setSelectedDate] = useState(today);

      // Mascot reroll seed
      const [mascotRerollSeed, setMascotRerollSeed] = useState(0);
      const mascotLevel = getLevelForDate(selectedDate, mascotRerollSeed);

      // Home Quick AI input state
      const [homeChatInput, setHomeChatInput] = useState('');
      const [homeChatLoading, setHomeChatLoading] = useState(false);
      const [homeChatToast, setHomeChatToast] = useState('');

      // Modals
      const [showSettings, setShowSettings] = useState(false);
      const [showScanner, setShowScanner] = useState(false);
      const [showManualAdd, setShowManualAdd] = useState(false);
      const [manualType, setManualType] = useState('EXPENSE');
      const [isScanning, setIsScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState(null); // { current, total, status, fileName }
      const [parsedSlips, setParsedSlips] = useState([]); // Array of parsed slips for batch scanning
      const [previewSlipImage, setPreviewSlipImage] = useState(null);

      // Sync user data when switching or logging in
      useEffect(() => {
        if (currentUser) {
          const rawTxns = localStorage.getItem(`setthi_txns_${currentUser.username}`);
          setTransactions(rawTxns ? JSON.parse(rawTxns) : (currentUser.username === 'maxnum' ? DEFAULT_TRANSACTIONS_MAXNUM : DEFAULT_TRANSACTIONS_MANOW));

          const rawSet = localStorage.getItem(`setthi_settings_${currentUser.username}`);
          const parsed = rawSet ? JSON.parse(rawSet) : {};
          setSettings({
            geminiApiKey: parsed.geminiApiKey || DEFAULT_GEMINI_KEY,
            googleAppsScriptUrl: parsed.googleAppsScriptUrl || DEFAULT_GAS_URL,
            dailyBudget: parsed.dailyBudget || (currentUser.username === 'maxnum' ? 600 : 500),
            monthlyLimit: parsed.monthlyLimit || (currentUser.username === 'maxnum' ? 20000 : 18000),
            streakCount: parsed.streakCount || 3
          });
        }
      }, [currentUser]);

      // Save transactions per user
      useEffect(() => {
        if (currentUser) {
          localStorage.setItem(`setthi_txns_${currentUser.username}`, JSON.stringify(transactions));
        }
      }, [transactions, currentUser]);

      // Save settings per user
      useEffect(() => {
        if (currentUser) {
          localStorage.setItem(`setthi_settings_${currentUser.username}`, JSON.stringify(settings));
        }
      }, [settings, currentUser]);

      // Logout handler
      const handleLogout = () => {
        if (confirm('ต้องการออกจากระบบใช่หรือไม่?')) {
          localStorage.removeItem('setthi_auth_session');
          setCurrentUser(null);
        }
      };

      // Monthly Calculations
      const selectedMonth = selectedDate.substring(0, 7); // e.g. "2026-11"
      const monthTxns = transactions.filter(t => t.date && t.date.startsWith(selectedMonth));
      const monthIncome = monthTxns.filter(t => t.type === 'INCOME').reduce((s, t) => s + t.amount, 0);
      const monthExpense = monthTxns.filter(t => t.type === 'EXPENSE').reduce((s, t) => s + t.amount, 0);
      const monthlyLimit = settings.monthlyLimit || 20000;
      const monthlyLimitRemaining = monthlyLimit - monthExpense;
      const netSavings = monthIncome - monthExpense;

      // Daily Calculations
      const dateTxns = transactions.filter(t => t.date === selectedDate);
      const dayExpense = dateTxns.filter(t => t.type === 'EXPENSE').reduce((s, t) => s + t.amount, 0);
      const dayIncome = dateTxns.filter(t => t.type === 'INCOME').reduce((s, t) => s + t.amount, 0);
      const dailyBenchmark = settings.dailyBudget || 600;
      const remainingDayBudget = dailyBenchmark - dayExpense;

      const cardClass = isBoy ? 'card-kawaii-blue' : 'card-kawaii-pink';
      const primaryBtnClass = isBoy ? 'btn-candy-blue' : 'btn-candy-pink';
      const primaryColor = isBoy ? '#38bdf8' : '#ff6584';
      const primaryBgColor = isBoy ? '#bae6fd' : '#fed7e2';

      const shiftDate = (days) => {
        const current = new Date(selectedDate);
        current.setDate(current.getDate() + days);
        setSelectedDate(current.toISOString().split('T')[0]);
      };

      // Multi-Image Batch Scanner (Gemini Vision OCR)
      const handleMultipleImageFiles = async (fileList) => {
        if (!fileList || fileList.length === 0) return;
        const files = Array.from(fileList);
        const apiKey = settings.geminiApiKey || DEFAULT_GEMINI_KEY;

        setIsScanning(true);
        setScanProgress({ current: 0, total: files.length, status: 'reading', fileName: '' });

        const newParsed = [];

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          setScanProgress({ current: i + 1, total: files.length, status: 'analyzing', fileName: file.name });

          try {
            const base64Data = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = (e) => resolve(e.target.result);
              reader.onerror = reject;
              reader.readAsDataURL(file);
            });

            const cleanBase64 = base64Data.replace(/^data:image\/[a-zA-Z0-9+.-]+;base64,/, '');
            const prompt = `
คุณคือ AI ผู้ช่วยตรวจสอบสลิปโอนเงินธนาคารไทย และใบเสร็จสินค้าของแอป "เศรษฐีหมูอ้วน"
จงวิเคราะห์ภาพที่ได้รับและแปลงเป็น JSON Object เท่านั้น:
{
  "type": "EXPENSE หรือ INCOME (ถ้าเป็นสลิปเงินเข้า บัญชีรับเงิน ให้ตอบ INCOME, ถ้าเป็นสลิปโอนออกหรือใบเสร็จ ให้ตอบ EXPENSE)",
  "merchant": "ชื่อร้านค้า หรือชื่อผู้รับเงิน/ผู้โอนเงิน",
  "amount": 0.00,
  "datetime": "YYYY-MM-DD HH:mm",
  "bank": "ธนาคารหรือวอลเล็ต เช่น KBank, SCB, KTB, BBL, TTB, GSB, TrueMoney",
  "suggestedCategory": "เลือก 1 หมวดหมู่: ถ้าเป็นรายจ่าย [อาหารและเครื่องดื่ม, ของใช้ & ช้อปปิ้ง, เดินทาง / น้ำมัน, บิล & ค่าน้ำค่าไฟ, สุขภาพ / ยา / คลินิก, บันเทิง & สังสรรค์, ค่าใช้จ่ายอื่นๆ], ถ้าเป็นรายรับ [เงินเดือนประจำ, ธุรกิจ / ค้าขาย / กำไร, โบนัส & คอมมิชชั่น, รับโอนเงิน / เพื่อนคืน, เงินปันผล & ดอกเบี้ย, รายรับพิเศษ / อื่นๆ]",
  "note": "บันทึกช่วยจำ (ถ้ามี)",
  "slipRef": "เลขอ้างอิงสลิป"
}`;

            let parsed = null;
            for (const model of GEMINI_CANDIDATE_MODELS) {
              try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{
                      parts: [
                        { text: prompt },
                        { inline_data: { mime_type: file.type || 'image/jpeg', data: cleanBase64 } }
                      ]
                    }],
                    generationConfig: { responseMimeType: "application/json" }
                  })
                });

                if (res.ok) {
                  const data = await res.json();
                  const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                  if (text) {
                    parsed = JSON.parse(text.trim());
                    break;
                  }
                }
              } catch (mErr) {
                console.warn(`Model ${model} failed for OCR:`, mErr);
              }
            }

            if (parsed) {
              newParsed.push({
                tempId: `slip-${Date.now()}-${i}-${Math.random().toString(36).substr(2, 4)}`,
                imagePreview: base64Data,
                type: parsed.type === 'INCOME' ? 'INCOME' : 'EXPENSE',
                amount: Number(parsed.amount) || 0,
                merchant: parsed.merchant || (parsed.type === 'INCOME' ? 'รายรับ' : 'ไม่ระบุชื่อ'),
                category: parsed.suggestedCategory || (parsed.type === 'INCOME' ? 'รายรับพิเศษ / อื่นๆ' : 'อาหารและเครื่องดื่ม'),
                wallet: parsed.bank || 'สลิป',
                note: parsed.note || 'สแกนจากสลิป/ใบเสร็จ',
                slipRef: parsed.slipRef || '',
                datetime: parsed.datetime || ''
              });
            } else {
              newParsed.push({
                tempId: `slip-${Date.now()}-${i}`,
                imagePreview: base64Data,
                type: 'EXPENSE',
                amount: 0,
                merchant: file.name.replace(/\.[^/.]+$/, ""),
                category: 'อาหารและเครื่องดื่ม',
                wallet: 'สลิป',
                note: 'สแกนจากรูปภาพ',
                slipRef: '',
                datetime: ''
              });
            }
          } catch (err) {
            console.error(`Error processing file ${file.name}:`, err);
          }
        }

        setParsedSlips(prev => [...prev, ...newParsed]);
        setIsScanning(false);
        setScanProgress(null);
      };

      const updateSlipItem = (tempId, field, val) => {
        setParsedSlips(prev => prev.map(s => s.tempId === tempId ? { ...s, [field]: val } : s));
      };

      const removeSlipItem = (tempId) => {
        setParsedSlips(prev => prev.filter(s => s.tempId !== tempId));
      };

      const handleSaveAllBatchSlips = async () => {
        if (!parsedSlips || parsedSlips.length === 0) return;

        const now = new Date();
        const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

        const newTxns = parsedSlips.map((item, idx) => {
          let dateStr = selectedDate;
          if (item.datetime && item.datetime.includes('-')) {
            const parts = item.datetime.split(' ')[0];
            if (/^\d{4}-\d{2}-\d{2}$/.test(parts)) dateStr = parts;
          }
          return {
            id: `TXN-SLIP-${Date.now()}-${idx}`,
            user: currentUser.username,
            date: dateStr,
            time: item.datetime && item.datetime.includes(' ') ? item.datetime.split(' ')[1] : timeStr,
            type: item.type,
            category: item.category,
            amount: parseFloat(item.amount) || 0,
            wallet: item.wallet || 'สลิป',
            merchant: item.merchant || (item.type === 'INCOME' ? 'รายรับ' : 'ไม่ระบุชื่อ'),
            note: item.note || 'สแกนจากสลิป/ใบเสร็จ',
            slipRef: item.slipRef || '',
            isCategorized: true
          };
        });

        setTransactions(prev => [...newTxns, ...prev]);

        const gasUrl = settings.googleAppsScriptUrl || DEFAULT_GAS_URL;
        if (gasUrl) {
          for (const t of newTxns) {
            try {
              await fetch(gasUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'addTransaction', transaction: t })
              });
            } catch (err) {
              console.warn('Sync batch slip to Google Sheets failed:', err);
            }
          }
        }

        confetti({ particleCount: 50, spread: 70, origin: { y: 0.7 } });
        alert(`บันทึกสลิปสำเร็จทั้งหมด ${newTxns.length} รายการเรียบร้อยแล้วอู๊ด! 🐷🎉`);
        setShowScanner(false);
        setParsedSlips([]);
      };

      // Save Transaction
      const handleSaveTransaction = async (txn) => {
        const fullTxn = {
          ...txn,
          user: currentUser.username
        };
        setTransactions(prev => [fullTxn, ...prev]);

        // Sync to Google Sheets if configured
        const gasUrl = settings.googleAppsScriptUrl || DEFAULT_GAS_URL;
        if (gasUrl) {
          try {
            await fetch(gasUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'addTransaction', transaction: fullTxn })
            });
          } catch (err) {
            console.warn('Sync to Google Sheets failed:', err);
          }
        }
        confetti({ particleCount: 35, spread: 50, origin: { y: 0.8 } });
      };

      // Delete Transaction
      const handleDelete = async (id) => {
        if (confirm('ต้องการลบรายการนี้ใช่หรือไม่?')) {
          setTransactions(prev => prev.filter(t => t.id !== id));

          const gasUrl = settings.googleAppsScriptUrl || DEFAULT_GAS_URL;
          if (gasUrl) {
            try {
              await fetch(gasUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'deleteTransaction', id, user: currentUser.username })
              });
            } catch (err) {
              console.warn('Sync delete to Google Sheets failed:', err);
            }
          }
        }
      };

      // If not logged in, show Login Screen
      if (!currentUser) {
        return (
          <LoginScreen
            onLogin={(user) => {
              setCurrentUser(user);
              localStorage.setItem('setthi_auth_session', JSON.stringify(user));
            }}
          />
        );
      }

      return (
        <div className="min-h-screen flex flex-col pb-20">
          {/* Header (Clean, Compact, No-wrap Mobile Optimized) */}
          <header className="sticky top-0 z-40 backdrop-blur-md bg-white/85 border-b border-slate-200/80 shadow-xs">
            <div className="max-w-lg mx-auto px-3.5 py-2.5 flex items-center justify-between gap-2">
              {/* Logo & App Name */}
              <div className="flex items-center gap-2 min-w-0">
                <div className="w-8 h-8 rounded-xl bg-pink-100 flex items-center justify-center shadow-xs overflow-hidden p-0.5 border border-pink-200 shrink-0">
                  <img
                    src={`./mascots/${isBoy ? 'maxnum' : 'manow'}_icon.png`}
                    alt="Icon"
                    className="w-full h-full object-contain"
                    onError={(e) => { e.target.style.display = 'none'; }}
                  />
                </div>
                <div className="flex items-center gap-1.5 min-w-0">
                  <h1 className="text-sm font-black text-slate-800 whitespace-nowrap">เศรษฐีหมูอ้วน</h1>
                  <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full text-white truncate max-w-[85px] ${isBoy ? 'bg-sky-500' : 'bg-pink-500'}`}>
                    {isBoy ? 'Maxnum' : 'Manow'}
                  </span>
                </div>
              </div>

              {/* Header Right Actions: Streak, Settings & Logout */}
              <div className="flex items-center gap-1.5 shrink-0">
                <div className="px-2 py-0.5 rounded-full text-[10px] font-black bg-amber-50 text-amber-600 border border-amber-200 whitespace-nowrap">
                  🔥 3 วัน
                </div>

                <button
                  onClick={() => setShowSettings(true)}
                  className="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 text-xs tap-bounce shrink-0"
                  title="ตั้งค่า"
                >
                  ⚙️
                </button>

                <button
                  onClick={handleLogout}
                  className="w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:bg-rose-50 hover:text-rose-600 border border-slate-200 flex items-center justify-center text-xs tap-bounce shrink-0"
                  title="ออกจากระบบ"
                >
                  🚪
                </button>
              </div>
            </div>
          </header>

          {/* View Mode Switcher (Desktop / Tablet view) */}
          <div className="hidden sm:block max-w-lg w-full mx-auto px-4 pt-3">
            <div className="flex bg-white/70 p-1 rounded-2xl border border-slate-200 gap-1 shadow-xs">
              <button
                onClick={() => setActiveTab('home')}
                className={`flex-1 py-2 rounded-xl text-xs font-black transition-all flex items-center justify-center gap-1.5 ${
                  activeTab === 'home'
                    ? isBoy ? 'bg-sky-500 text-white shadow-sm' : 'bg-pink-500 text-white shadow-sm'
                    : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                <span>🏠</span>
                <span>หน้าหลัก</span>
              </button>
              <button
                onClick={() => setActiveTab('chat')}
                className={`flex-1 py-2 rounded-xl text-xs font-black transition-all flex items-center justify-center gap-1.5 ${
                  activeTab === 'chat'
                    ? isBoy ? 'bg-sky-500 text-white shadow-sm' : 'bg-pink-500 text-white shadow-sm'
                    : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                <span>💬</span>
                <span>หมูอ้วนช่วยจด</span>
              </button>
              <button
                onClick={() => setActiveTab('stats')}
                className={`flex-1 py-2 rounded-xl text-xs font-black transition-all flex items-center justify-center gap-1.5 ${
                  activeTab === 'stats'
                    ? isBoy ? 'bg-sky-500 text-white shadow-sm' : 'bg-pink-500 text-white shadow-sm'
                    : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                <span>📊</span>
                <span>สถิติ & กราฟ</span>
              </button>
            </div>
          </div>

          {/* Main Layout */}
          <main className="max-w-lg w-full mx-auto px-3.5 py-3 space-y-3.5 flex-1 pb-24">
            {activeTab === 'stats' ? (
              <StatsView transactions={transactions} isBoy={isBoy} cardClass={cardClass} />
            ) : activeTab === 'chat' ? (
              <ChatView
                currentUser={currentUser}
                isBoy={isBoy}
                cardClass={cardClass}
                primaryBtnClass={primaryBtnClass}
                settings={settings}
                onSaveTransaction={handleSaveTransaction}
                onDeleteTransaction={handleDelete}
                transactions={transactions}
              />
            ) : (
              <div className="space-y-4 animate-in fade-in">
                {/* Date Navigator (Sleek Compact Bar) */}
                <div className="px-3 py-1.5 bg-white/80 backdrop-blur-sm rounded-2xl border border-slate-200/90 shadow-2xs flex items-center justify-between text-xs">
                  <button
                    onClick={() => shiftDate(-1)}
                    className="w-7 h-7 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center font-bold text-slate-500 tap-bounce"
                  >
                    ◀
                  </button>
                  <div className="text-center cursor-pointer flex items-center gap-1.5" onClick={() => setSelectedDate(today)}>
                    <span className="text-[11px] font-bold text-pink-500">
                      {selectedDate === today ? '✨ วันนี้' : 'ย้อนหลัง'}:
                    </span>
                    <span className="font-black text-slate-700 text-xs">
                      {new Date(selectedDate).toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}
                    </span>
                  </div>
                  <button
                    onClick={() => shiftDate(1)}
                    className="w-7 h-7 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center font-bold text-slate-500 tap-bounce"
                  >
                    ▶
                  </button>
                </div>

                {/* Quick AI Chat Input Bar (Sleek Compact Bar) */}
                <div className={`p-3 ${cardClass} border-2 ${isBoy ? 'border-sky-300' : 'border-pink-300'} space-y-2 shadow-sm`}>
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-1.5">
                      <span className="text-sm">💬</span>
                      <h3 className="text-xs font-black text-slate-800">หมูอ้วนช่วยจด AI</h3>
                    </div>
                    <button
                      onClick={() => setActiveTab('chat')}
                      className={`text-[10px] font-bold ${isBoy ? 'text-sky-600' : 'text-pink-600'} hover:underline flex items-center gap-1`}
                    >
                      <span>ห้องแชทเต็มจอ</span>
                      <span>→</span>
                    </button>
                  </div>

                  <form
                    onSubmit={async (e) => {
                      e.preventDefault();
                      if (!homeChatInput.trim() || homeChatLoading) return;
                      const text = homeChatInput.trim();
                      setHomeChatInput('');
                      setHomeChatLoading(true);
                      try {
                        const apiKey = settings.geminiApiKey || DEFAULT_GEMINI_KEY;
                        const parsed = await parseTransactionWithAI(text, apiKey);
                        if (parsed && parsed.isTransaction && parsed.amount > 0) {
                          const now = new Date();
                          const ymd = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                          const newTxn = {
                            id: `TXN-AI-${Date.now()}`,
                            user: currentUser.username,
                            date: ymd,
                            time: now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                            type: parsed.type === 'INCOME' ? 'INCOME' : 'EXPENSE',
                            category: parsed.category || (parsed.type === 'INCOME' ? 'รายรับพิเศษ / อื่นๆ' : 'ค่าใช้จ่ายอื่นๆ'),
                            amount: Number(parsed.amount),
                            wallet: parsed.wallet || 'เงินสด',
                            merchant: parsed.merchant || (parsed.type === 'INCOME' ? 'รายรับ' : 'ค่าใช้จ่าย'),
                            note: parsed.note ? `[หมูอ้วน AI] ${parsed.note}` : '[หมูอ้วน AI]',
                            isCategorized: true
                          };
                          await handleSaveTransaction(newTxn);

                          // Append to chat history
                          const historyRaw = localStorage.getItem(`setthi_chat_${currentUser.username}`);
                          const history = historyRaw ? JSON.parse(historyRaw) : [];
                          history.push(
                            { id: `usr-${Date.now()}`, sender: 'user', text, time: now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) },
                            { id: `ai-${Date.now()}`, sender: 'assistant', text: parsed.replyMessage || `จด ${newTxn.merchant} ฿${newTxn.amount} เรียบร้อยแล้วน้า! 🐷`, savedTxn: newTxn, time: now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) }
                          );
                          localStorage.setItem(`setthi_chat_${currentUser.username}`, JSON.stringify(history));

                          setHomeChatToast(`✅ บันทึก "${newTxn.merchant}" ฿${newTxn.amount.toLocaleString()} เรียบร้อยแล้วอู๊ด!`);
                          setTimeout(() => setHomeChatToast(''), 4500);
                        } else {
                          setHomeChatToast(parsed?.replyMessage || 'หมูอ้วนยังไม่เห็นจำนวนเงินเลยอู๊ดๆ 🐷');
                          setTimeout(() => setHomeChatToast(''), 4500);
                        }
                      } catch (err) {
                        console.error(err);
                        setHomeChatToast('เกิดข้อผิดพลาดในการช่วยจด');
                        setTimeout(() => setHomeChatToast(''), 4500);
                      } finally {
                        setHomeChatLoading(false);
                      }
                    }}
                    className="flex gap-2"
                  >
                    <input
                      type="text"
                      value={homeChatInput}
                      onChange={(e) => setHomeChatInput(e.target.value)}
                      placeholder="เช่น ข้าวกะเพรา 60, ค่าน้ำมัน 500, เงินเดือน 30000"
                      className="flex-1 text-xs bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none focus:border-pink-400 font-medium"
                      disabled={homeChatLoading}
                    />
                    <button
                      type="submit"
                      disabled={homeChatLoading || !homeChatInput.trim()}
                      className={`px-4 py-2 ${primaryBtnClass} text-xs font-black shadow-xs shrink-0 flex items-center gap-1 disabled:opacity-50`}
                    >
                      {homeChatLoading ? '🐽...' : '🚀 จด'}
                    </button>
                  </form>

                  {homeChatToast && (
                    <div className="p-2 rounded-xl bg-pink-100/90 border border-pink-200 text-slate-800 text-xs font-bold animate-in fade-in flex items-center justify-between">
                      <span>{homeChatToast}</span>
                      <button onClick={() => setHomeChatToast('')} className="text-slate-400 hover:text-slate-600 font-bold ml-2">✕</button>
                    </div>
                  )}

                  {/* Quick chips */}
                  <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-0.5">
                    {['🍜 ข้าวเที่ยง 60', '☕ กาแฟ 50', '🚗 น้ำมัน 500', '💰 เงินเดือน 35000', '💸 เพื่อนคืน 200'].map(chip => (
                      <button
                        key={chip}
                        type="button"
                        disabled={homeChatLoading}
                        onClick={() => setHomeChatInput(chip)}
                        className="text-[10px] font-bold px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg whitespace-nowrap"
                      >
                        {chip}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Mascot Stage & Daily Benchmark Card (Streamlined) */}
                <div className={`p-4 ${cardClass} relative overflow-hidden space-y-3`}>
                  <div className="flex items-center justify-between gap-2.5">
                    {/* Left: Mascot & Quote */}
                    <div className="flex items-center gap-2.5 min-w-0">
                      <PigMascot
                        level={mascotLevel}
                        isBoy={isBoy}
                        size="md"
                        onClick={() => {
                          setMascotRerollSeed(s => s + 1);
                          confetti({ particleCount: 25, spread: 40 });
                        }}
                      />
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center gap-1.5 mb-1">
                          <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-full text-white whitespace-nowrap ${isBoy ? 'bg-sky-500' : 'bg-pink-500'}`}>
                            น้องหมูอ้วน
                          </span>
                          <button
                            type="button"
                            onClick={() => setMascotRerollSeed(s => s + 1)}
                            className="text-[9px] text-slate-400 font-bold hover:text-slate-700 whitespace-nowrap bg-slate-100 px-1.5 py-0.5 rounded-full"
                          >
                            🎲 สลับรูป
                          </button>
                        </div>
                        <p className="text-xs font-bold text-slate-700 leading-tight">
                          {dayExpense > dailyBenchmark 
                            ? 'อู๊ดๆ! วันนี้ช้อปเกินเกณฑ์วันไปแล้วนะ เพลาๆ หน่อย!'
                            : 'เศรษฐีหมูอ้วนคอยเฝ้ากระปุกให้อยู่นะอู๊ด!'
                          }
                        </p>
                      </div>
                    </div>

                    {/* Right: Circular Progress for Daily Benchmark */}
                    <div className="shrink-0">
                      <CircularProgress
                        value={dayExpense}
                        max={dailyBenchmark}
                        size={78}
                        strokeWidth={7}
                        color={dayExpense > dailyBenchmark ? '#ef4444' : primaryColor}
                        bgColor={primaryBgColor}
