                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-black text-slate-800">➕ จดรายการด้วยตนเอง</h3>
                  <button onClick={() => setShowManualAdd(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                {/* Type Toggle: Expense vs Income */}
                <div className="flex bg-slate-100 p-1 rounded-2xl gap-1">
                  <button
                    type="button"
                    onClick={() => setManualType('EXPENSE')}
                    className={`flex-1 py-1.5 rounded-xl text-xs font-black transition-all ${
                      manualType === 'EXPENSE' ? 'bg-rose-500 text-white shadow-xs' : 'text-slate-500 hover:text-slate-700'
                    }`}
                  >
                    🔴 รายจ่าย
                  </button>
                  <button
                    type="button"
                    onClick={() => setManualType('INCOME')}
                    className={`flex-1 py-1.5 rounded-xl text-xs font-black transition-all ${
                      manualType === 'INCOME' ? 'bg-emerald-500 text-white shadow-xs' : 'text-slate-500 hover:text-slate-700'
                    }`}
                  >
                    🟢 รายรับ
                  </button>
                </div>

                <div>
                  <label className="text-[11px] font-bold text-slate-500">
                    {manualType === 'EXPENSE' ? 'ยอดเงินรายจ่าย (บาท)' : 'ยอดเงินรายรับ (บาท)'}
                  </label>
                  <input
                    type="number"
                    step="0.01"
                    id="manual_amount"
                    placeholder="0.00"
                    className={`w-full font-mono text-xl font-black bg-slate-50 border-2 rounded-xl px-3 py-2 outline-none ${
                      manualType === 'EXPENSE' ? 'text-rose-500 border-rose-200' : 'text-emerald-500 border-emerald-200'
                    }`}
                  />
                </div>
                <div>
                  <label className="text-[11px] font-bold text-slate-500">
                    {manualType === 'EXPENSE' ? 'ชื่อสินค้า / ร้านค้า' : 'แหล่งที่มาของรายรับ'}
                  </label>
                  <input
                    type="text"
                    id="manual_merchant"
                    placeholder={manualType === 'EXPENSE' ? 'เช่น ข้าวหมูกรอบ, ชาไข่มุก' : 'เช่น เงินเดือน, โบนัส, ขายของ'}
                    className="w-full text-xs font-bold text-slate-700 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none"
                  />
                </div>
                <div>
                  <label className="text-[11px] font-bold text-slate-500">
                    หมวดหมู่{manualType === 'INCOME' ? 'รายรับ' : 'รายจ่าย'}
                  </label>
                  <select
                    id="manual_category"
                    className="w-full text-xs font-bold text-slate-700 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none"
                  >
                    {(manualType === 'INCOME' ? INCOME_CATEGORIES : EXPENSE_CATEGORIES).map(c => (
                      <option key={c.id} value={c.name}>{c.icon} {c.name}</option>
                    ))}
                  </select>
                </div>

                <div className="flex gap-2 pt-2">
                  <button onClick={() => setShowManualAdd(false)} className="flex-1 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold text-xs">
                    ยกเลิก
                  </button>
                  <button
                    onClick={() => {
                      const amt = parseFloat(document.getElementById('manual_amount').value) || 0;
                      const mer = document.getElementById('manual_merchant').value || (manualType === 'INCOME' ? 'รายรับ' : 'ไม่ระบุ');
                      const cat = document.getElementById('manual_category').value;

                      handleSaveTransaction({
                        id: `TXN-${Date.now()}`,
                        date: selectedDate,
                        time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                        type: manualType,
                        category: cat,
                        amount: amt,
                        wallet: 'เงินสด',
                        merchant: mer,
                        note: 'จดด้วยตนเอง',
                        isCategorized: true
                      });
                      setShowManualAdd(false);
                    }}
                    className={`flex-1 py-2.5 ${manualType === 'INCOME' ? 'bg-emerald-500 hover:bg-emerald-600 text-white rounded-full' : 'btn-candy-yellow'} text-xs font-black shadow-md`}
                  >
                    {manualType === 'INCOME' ? '💰 บันทึกรายรับ' : '💾 บันทึกรายจ่าย'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Settings Modal */}
          {showSettings && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="max-w-sm w-full p-5 bg-white rounded-3xl shadow-2xl space-y-3.5 border-2 border-slate-200 text-xs">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-black text-slate-800">⚙️ ตั้งค่า: {currentUser.name}</h3>
                  <button onClick={() => setShowSettings(false)} className="text-slate-400 font-bold">✕</button>
                </div>

                <div>
                  <label className="font-bold text-slate-600 block mb-1">ขีดจำกัดงบรายจ่ายเดือนนี้ (บาท)</label>
                  <input
                    type="number"
                    id="cfg_monthly_limit"
                    defaultValue={settings.monthlyLimit || 20000}
                    className="w-full font-bold bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none"
                  />
                  <p className="text-[10px] text-slate-400 mt-1">
                    🎯 กำหนดเป้าหมายว่าจะใช้ไม่เกินเท่าไหร่ในเดือนนี้ (รายรับจะนับแยกต่างหาก)
                  </p>
                </div>

                <div>
                  <label className="font-bold text-slate-600 block mb-1">เกณฑ์กำหนดรายวัน (บาท/วัน)</label>
                  <input
                    type="number"
                    id="cfg_daily_budget"
                    defaultValue={settings.dailyBudget || 600}
                    className="w-full font-bold bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none"
                  />
                  <p className="text-[10px] text-slate-400 mt-0.5">
                    📌 เกณฑ์อ้างอิงเปรียบเทียบในวงแหวนของน้องหมูแต่ละวัน
                  </p>
                </div>

                <div>
                  <label className="font-bold text-slate-600 block mb-1">Gemini API Key (สำหรับ AI ช่วยจด & สแกนสลิป)</label>
                  <input
                    type="password"
                    id="cfg_key"
                    defaultValue={settings.geminiApiKey || DEFAULT_GEMINI_KEY}
                    placeholder="AQ.Ab8..."
                    className="w-full font-mono bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none"
                  />
                  <p className="text-[10px] text-emerald-600 mt-0.5 font-bold">
                    ✅ ฝังคีย์มาตรฐานจาก App MooAuan ให้เรียบร้อยแล้ว
                  </p>
                </div>

                <div>
                  <label className="font-bold text-slate-600 block mb-1">Google Apps Script Web App URL</label>
                  <input
                    type="url"
                    id="cfg_url"
                    defaultValue={settings.googleAppsScriptUrl || DEFAULT_GAS_URL}
                    placeholder="https://script.google.com/macros/s/.../exec"
                    className="w-full font-mono bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-slate-800 outline-none"
                  />
                  <p className="text-[10px] text-emerald-600 mt-0.5 font-bold">
                    ✅ ฝัง URL เชื่อม Google Sheets เรียบร้อยแล้ว
                  </p>
                </div>

                <div className="flex gap-2 pt-2">
                  <button onClick={() => setShowSettings(false)} className="flex-1 py-2.5 rounded-full bg-slate-100 text-slate-600 font-bold">
                    ปิด
                  </button>
                  <button
                    onClick={() => {
                      const k = document.getElementById('cfg_key').value.trim() || DEFAULT_GEMINI_KEY;
                      const u = document.getElementById('cfg_url').value.trim() || DEFAULT_GAS_URL;
                      const db = parseFloat(document.getElementById('cfg_daily_budget').value) || 600;
                      const ml = parseFloat(document.getElementById('cfg_monthly_limit').value) || 20000;

                      setSettings(prev => ({
                        ...prev,
                        geminiApiKey: k,
                        googleAppsScriptUrl: u,
                        dailyBudget: db,
                        monthlyLimit: ml
                      }));
                      setShowSettings(false);
                      alert('บันทึกการตั้งค่าเรียบร้อยแล้วอู๊ด!');
                    }}
                    className={`flex-1 py-2.5 ${primaryBtnClass} text-xs font-black shadow-md`}
                  >
                    บันทึก
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
